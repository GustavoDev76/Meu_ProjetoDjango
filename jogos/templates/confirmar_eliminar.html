{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm p-4">
            <h3 class="text-danger">Confirmar Exclusão</h3>
            <p>Tem a certeza de que deseja eliminar o jogo <strong>"{{ jogo.titulo }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'home' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sim, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
