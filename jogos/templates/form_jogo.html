{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">{{ titulo_pagina }}</h3>
            <form method="post">
                <!-- Medida de segurança OBRIGATÓRIA no Django contra ataques maliciosos -->
                {% csrf_token %}
                
                <!-- O Django desenha os campos do formulário aqui -->
                {{ form.as_p }}
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
